// Mosaicos sin clave de API: Esri World Street Map (principal) y OpenStreetMap (respaldo)
const TILE_URL = (z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/${z}/${y}/${x}`;
const TILE_URL_FALLBACK = (z,x,y)=>`https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
const TILE_VER = "esri1";

/* =====================================================================
   ALMACENAMIENTO (IndexedDB con respaldo en memoria/localStorage)
   ===================================================================== */
const Store = (()=>{
  let db=null, mem={kv:new Map(),tiles:new Map()};
  const open = ()=>new Promise(res=>{
    try{
      const r=indexedDB.open("rutacosta",1);
      r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore("kv");d.createObjectStore("tiles");};
      r.onsuccess=()=>{db=r.result;res(true)};
      r.onerror=()=>res(false);
    }catch(e){res(false)}
  });
  const tx=(st,mode,fn)=>new Promise((res,rej)=>{
    try{const t=db.transaction(st,mode);const s=t.objectStore(st);const r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);}catch(e){rej(e)}
  });
  return {
    open,
    async get(k){ if(!db){ if(mem.kv.has(k))return mem.kv.get(k); try{const v=localStorage.getItem("rc_"+k);return v?JSON.parse(v):undefined}catch(e){return undefined} } return tx("kv","readonly",s=>s.get(k)); },
    async set(k,v){ if(!db){ mem.kv.set(k,v); try{localStorage.setItem("rc_"+k,JSON.stringify(v))}catch(e){} return;} return tx("kv","readwrite",s=>s.put(v,k)); },
    async tile(k){ k=TILE_VER+"/"+k; if(!db)return mem.tiles.get(k); return tx("tiles","readonly",s=>s.get(k)); },
    async putTile(k,b){ k=TILE_VER+"/"+k; if(!db){mem.tiles.set(k,b);return} return tx("tiles","readwrite",s=>s.put(b,k)); },
    async tileKeys(){ const p=TILE_VER+"/"; let keys; if(!db)keys=[...mem.tiles.keys()]; else keys=await tx("tiles","readonly",s=>s.getAllKeys()); return new Set((keys||[]).filter(k=>String(k).startsWith(p)).map(k=>String(k).slice(p.length))); },
    async clearTiles(){ if(!db){mem.tiles.clear();return} return tx("tiles","readwrite",s=>s.clear()); },
    get persistent(){return !!db}
  };
})();

/* =====================================================================
   GEOMETRÍA
   ===================================================================== */
const R_E=6371008.8, rad=Math.PI/180;
function hav(a,b){const dLa=(b[0]-a[0])*rad,dLo=(b[1]-a[1])*rad;const s=Math.sin(dLa/2)**2+Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(dLo/2)**2;return 2*R_E*Math.asin(Math.sqrt(s));}
function cumul(pts){const c=[0];for(let i=1;i<pts.length;i++)c.push(c[i-1]+hav(pts[i-1],pts[i]));return c;}
// proyecta p sobre polilínea: devuelve {along, dist, i}
function project(p,pts,cum,hint){
  let best={dist:Infinity,along:0,i:0};
  const kx=Math.cos(p[0]*rad)*111320, ky=110540;
  let i0=0,i1=pts.length-1;
  if(hint!=null){i0=Math.max(0,hint-400);i1=Math.min(pts.length-1,hint+400);}
  const scan=(a,b)=>{for(let i=a;i<b;i++){
    const A=pts[i],B=pts[i+1];
    const ax=(A[1]-p[1])*kx, ay=(A[0]-p[0])*ky, bx=(B[1]-p[1])*kx, by=(B[0]-p[0])*ky;
    const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy;
    let t=L?-(ax*dx+ay*dy)/L:0; t=Math.max(0,Math.min(1,t));
    const x=ax+t*dx,y=ay+t*dy,d=Math.hypot(x,y);
    if(d<best.dist)best={dist:d,along:cum[i]+t*(cum[i+1]-cum[i]),i};
  }};
  scan(i0,i1);
  if(hint!=null&&best.dist>500){best={dist:Infinity,along:0,i:0};scan(0,pts.length-1);}
  return best;
}
function pointAt(along,pts,cum){
  if(along<=0)return pts[0]; const n=cum.length-1; if(along>=cum[n])return pts[n];
  let lo=0,hi=n; while(hi-lo>1){const m=(lo+hi)>>1; if(cum[m]<=along)lo=m; else hi=m;}
  const t=(along-cum[lo])/((cum[hi]-cum[lo])||1);
  return [pts[lo][0]+t*(pts[hi][0]-pts[lo][0]), pts[lo][1]+t*(pts[hi][1]-pts[lo][1])];
}
function decodePolyline(str,prec=5){let i=0,lat=0,lon=0,out=[],f=10**prec;while(i<str.length){let b,s=0,r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5}while(b>=32);lat+=r&1?~(r>>1):r>>1;s=0;r=0;do{b=str.charCodeAt(i++)-63;r|=(b&31)<<s;s+=5}while(b>=32);lon+=r&1?~(r>>1):r>>1;out.push([lat/f,lon/f]);}return out;}

   ===================================================================== */
function limitAt(km,dir){
  if(km==null)return null;
  const t=dir==="A"?DATA.speedA:DATA.speedD; let v=null;
  if(dir==="A"){for(const r of t){if(r[0]<=km)v=r[1];else break;}}
  else{for(const r of t){if(r[0]>=km)v=r[1];else break;}}
  return v;
}
function nextChange(km,dir){
  const t=dir==="A"?DATA.speedA:DATA.speedD;
  for(const r of t){ if(dir==="A"?r[0]>km:r[0]<km) return {km:r[0],v:r[1]}; }
  return null;
}
// Calibración km oficial ⇄ distancia sobre la ruta principal (piecewise lineal)
let CAL=null;
function calibrate(route,anchors){
  const pts=[];
  for(const a of anchors){
    const pr=project([a.lat,a.lon],route.pts,route.cum);
    if(pr.dist<6000)pts.push({km:a.km,along:pr.along,name:a.name,dist:pr.dist});
  }
  pts.sort((a,b)=>a.km-b.km);
  const ok=[];
  for(const p of pts){ if(!ok.length||(p.along>ok[ok.length-1].along+1000)) ok.push(p); }
  if(ok.length<3)return null;
  return {pts:ok};
}
function kmFromAlong(al){
  if(!CAL)return null; const p=CAL.pts,n=p.length;
  if(al<=p[0].along)return p[0].km-(p[0].along-al)/1000;
  if(al>=p[n-1].along)return p[n-1].km+(al-p[n-1].along)/1000;
  for(let i=0;i<n-1;i++)if(al<=p[i+1].along){const t=(al-p[i].along)/(p[i+1].along-p[i].along);return p[i].km+t*(p[i+1].km-p[i].km);}
}
function alongFromKm(km){
  if(!CAL)return null; const p=CAL.pts,n=p.length;
  if(km<=p[0].km)return p[0].along-(p[0].km-km)*1000;
  if(km>=p[n-1].km)return p[n-1].along+(km-p[n-1].km)*1000;
  for(let i=0;i<n-1;i++)if(km<=p[i+1].km){const t=(km-p[i].km)/(p[i+1].km-p[i].km);return p[i].along+t*(p[i+1].along-p[i].along);}
}
const fmtKm=k=>k==null?"–":k.toFixed(1).replace(".",",");
const fmtD=m=>m<1000?Math.round(m/10)*10+" m":(m/1000).toFixed(m<10000?1:0).replace(".",",")+" km";

const S = {
  dir:"A", routes:{}, active:"principal", osm:null, weather:null, updatedAt:null,
  pois:[], gps:null, follow:false, watchId:null, alerted:new Set(), online:navigator.onLine
};

function buildPois(){
  // POIs con coordenadas: radares oficiales ubicados sobre la ruta principal, peajes, precauciones, OSM
  const out=[]; const main=S.routes.principal;
  if(main&&CAL){
    for(const r of DATA.fixed){const al=alongFromKm(r.km); if(al<0||al>main.cum[main.cum.length-1])continue; const p=pointAt(al,main.pts,main.cum);
      out.push({type:"radar",lat:p[0],lon:p[1],km:r.km,s:r.s,title:"Radar fijo · "+r.loc,src:r.src,calc:true});}
    for(const t of DATA.tolls){const al=alongFromKm(t.km); if(al<0||al>main.cum[main.cum.length-1])continue; const p=pointAt(al,main.pts,main.cum);
      if(!(S.osm&&S.osm.tolls.some(o=>hav([o.lat,o.lon],p)<3000))) out.push({type:"toll",lat:p[0],lon:p[1],km:t.km,s:"AD",title:t.name,calc:true});}
    for(const c of DATA.caution){const al=alongFromKm(c.km); if(al<0||al>main.cum[main.cum.length-1])continue; const p=pointAt(al,main.pts,main.cum);
      out.push({type:"caution",lat:p[0],lon:p[1],km:c.km,s:"AD",title:"Precaución · "+c.txt,calc:true});}
    for(const m of DATA.mobile){ if(m.general)continue; const a=alongFromKm(m.from),b=alongFromKm(m.to); const p=pointAt((a+b)/2,main.pts,main.cum);
      out.push({type:"mobile",lat:p[0],lon:p[1],km:(m.from+m.to)/2,from:m.from,to:m.to,s:m.s,title:"Zona de control móvil · km "+m.from+"–"+m.to,src:m.src,txt:m.txt,calc:true});}
  }
  if(S.osm){
    for(const c of S.osm.cams){
      // evita duplicar un radar oficial a menos de 700 m
      if(out.some(o=>o.type==="radar"&&hav([o.lat,o.lon],[c.lat,c.lon])<700)){c.dup=true;}
      out.push({type:"osmcam",lat:c.lat,lon:c.lon,title:(c.avg?"Control de velocidad promedio":"Cámara/radar")+" (OpenStreetMap)",max:c.max,s:"AD",dup:c.dup,src:"OpenStreetMap (comunidad)"});
    }
    for(const t of S.osm.tolls) out.push({type:"toll",lat:t.lat,lon:t.lon,title:t.name||"Peaje",s:"AD",src:"OpenStreetMap"});
    for(const f of S.osm.fuel) out.push({type:"fuel",lat:f.lat,lon:f.lon,title:(f.brand||f.name||"Estación de servicio"),s:"AD",src:"OpenStreetMap"});
  }
  if(main){ for(const p of out){ const pr=project([p.lat,p.lon],main.pts,main.cum); p.mainDist=pr.dist; p.mainAlong=pr.along; if(p.km==null&&pr.dist<150&&CAL)p.km=kmFromAlong(pr.along);} }
  S.pois=out;
}

async function fetchJSON(url,opt={},ms=45000){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{...opt,signal:c.signal}); if(!r.ok)throw new Error("HTTP "+r.status); return await r.json();}
  finally{clearTimeout(t)}
}
async function osrm(points,exclude,alternatives){
  const coords=points.map(p=>p[1].toFixed(5)+","+p[0].toFixed(5)).join(";");
  let url=`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=polyline&steps=false`;
  if(exclude)url+="&exclude="+exclude;
  if(alternatives)url+="&alternatives=3";
  const j=await fetchJSON(url);
  if(j.code!=="Ok")throw new Error(j.message||j.code);
  return j.routes.map(r=>{const pts=decodePolyline(r.geometry);return {pts,cum:cumul(pts),dist:r.distance,dur:r.duration};});
}
function thin(pts,minM=25){const o=[pts[0]];for(let i=1;i<pts.length;i++){if(hav(o[o.length-1],pts[i])>=minM||i===pts.length-1)o.push(pts[i]);}return o;}

async function updateAll(withTiles){
  const log=msg=>{const el=document.getElementById("updLog"); if(el){el.textContent=msg;}};
  const o=[PLACES.origen.lat,PLACES.origen.lon], d=[PLACES.destino.lat,PLACES.destino.lon];
  const routes={}; const errors=[];
  log("Calculando ruta principal y alternativas…");
  try{
    const rs=await osrm([o,d],null,true);
    routes.principal={...rs[0],name:DESVIOS[0].name,color:DESVIOS[0].color};
    rs.slice(1).forEach((r,i)=>{routes["alt"+(i+1)]={...r,name:"Alternativa automática "+(i+1),color:["#00a8a8","#b8860b","#d35400"][i],desc:"Sugerida por el ruteador (OSRM)."};});
  }catch(e){errors.push("Ruta principal: "+e.message);}
  for(const dv of DESVIOS.slice(1)){
    log("Calculando desvío: "+dv.name+"…");
    try{const [r]=await osrm([o,...dv.via,d],dv.exclude,false);routes[dv.id]={...r,name:dv.name,color:dv.color,desc:dv.desc};}
    catch(e){errors.push(dv.name+": "+e.message);}
    await new Promise(r=>setTimeout(r,700));
  }
  if(!routes.principal){ log("No se pudo calcular la ruta. "+errors.join(" · ")); return false; }
  for(const k in routes){ routes[k].pts=thin(routes[k].pts); routes[k].cum=cumul(routes[k].pts); }

  // OpenStreetMap: cámaras, controles, peajes, estaciones, localidades (anclas)
  log("Buscando radares, peajes y estaciones en OpenStreetMap…");
  let osm=S.osm;
  try{
    let la1=90,la2=-90,lo1=180,lo2=-180;
    for(const k in routes)for(const p of routes[k].pts){la1=Math.min(la1,p[0]);la2=Math.max(la2,p[0]);lo1=Math.min(lo1,p[1]);lo2=Math.max(lo2,p[1]);}
    const bb=`${(la1-.05).toFixed(3)},${(lo1-.05).toFixed(3)},${(la2+.05).toFixed(3)},${(lo2+.05).toFixed(3)}`;
    const names=DATA.anchors.map(a=>a.name).join("|");
    const q=`[out:json][timeout:90];(node["highway"="speed_camera"](${bb});relation["type"="enforcement"](${bb});node["barrier"="toll_booth"](${bb});way["barrier"="toll_booth"](${bb});node["amenity"="fuel"](${bb});way["amenity"="fuel"](${bb});node["place"~"city|town|village"]["name"~"^(${names})$"](${bb}););out center tags;`;
    let j=null;
    for(const ep of ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"]){
      try{j=await fetchJSON(ep,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}},100000);break;}catch(e){errors.push("Overpass ("+ep.split("/")[2]+"): "+e.message);}
    }
    if(j){
      const near=(lat,lon,m)=>{for(const k in routes){const r=routes[k];if(project([lat,lon],r.pts,r.cum).dist<m)return true;}return false;};
      osm={cams:[],tolls:[],fuel:[],places:[],at:new Date().toISOString()};
      for(const e of j.elements){
        const lat=e.lat??e.center?.lat, lon=e.lon??e.center?.lon, t=e.tags||{}; if(lat==null)continue;
        if(t.highway==="speed_camera"||t.type==="enforcement"){ if(t.type==="enforcement"&&t.enforcement&&!/maxspeed|average_speed|traffic_signals/.test(t.enforcement))continue;
          if(near(lat,lon,250))osm.cams.push({lat,lon,max:t.maxspeed||null,avg:t.enforcement==="average_speed"});}
        else if(t.barrier==="toll_booth"){ if(near(lat,lon,300))osm.tolls.push({lat,lon,name:t.name}); }
        else if(t.amenity==="fuel"){ if(near(lat,lon,250))osm.fuel.push({lat,lon,name:t.name,brand:t.brand}); }
        else if(t.place){ osm.places.push({name:t.name,lat,lon}); }
      }
      // peajes: unir cabinas cercanas
      const tl=[];for(const t of osm.tolls){if(!tl.some(x=>hav([x.lat,x.lon],[t.lat,t.lon])<800))tl.push(t);}osm.tolls=tl;
    }
  }catch(e){errors.push("OSM: "+e.message);}

  // Pronóstico (Open-Meteo)
  log("Descargando pronóstico…");
  let weather=S.weather;
  try{
    const locs=[["La Plata",-34.92,-57.95],["Dolores",-36.31,-57.68],["Mar del Plata",-38.0,-57.56]];
    const w=await fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${locs.map(l=>l[1]).join(",")}&longitude=${locs.map(l=>l[2]).join(",")}&daily=temperature_2m_min,temperature_2m_max,precipitation_probability_max,wind_gusts_10m_max,weather_code&timezone=America%2FArgentina%2FBuenos_Aires&forecast_days=3`);
    const arr=Array.isArray(w)?w:[w];
    weather={at:new Date().toISOString(),locs:arr.map((x,i)=>({name:locs[i][0],daily:x.daily}))};
  }catch(e){errors.push("Pronóstico: "+e.message);}

  S.routes=routes; S.osm=osm; S.weather=weather; S.updatedAt=new Date().toISOString(); S.errors=errors;
  if(!S.routes[S.active])S.active="principal";
  applyCalibration();
  await saveState();
  if(withTiles){ await downloadTiles(log); }
  log("Listo"+(errors.length?" (con avisos: "+errors.join(" · ")+")":"")+".");
  renderAll(); MapView.fit();
  return true;
}
function applyCalibration(){
  const main=S.routes.principal; if(!main){CAL=null;return;}
  let anchors=DATA.anchors.map(a=>({...a}));
  if(S.osm&&S.osm.places)for(const a of anchors){const p=S.osm.places.find(x=>x.name===a.name);if(p){a.lat=p.lat;a.lon=p.lon;}}
  if(S.osm&&S.osm.tolls){const sb=S.osm.tolls.find(t=>/samborom/i.test(t.name||""));if(sb)anchors.push({name:"Peaje Samborombón",km:90.1,lat:sb.lat,lon:sb.lon});}
  CAL=calibrate(main,anchors);
  buildPois();
}
async function saveState(){
  const pack={routes:{},osm:S.osm,weather:S.weather,updatedAt:S.updatedAt,active:S.active,dir:S.dir,errors:S.errors||[]};
  for(const k in S.routes){const r=S.routes[k];pack.routes[k]={pts:r.pts.map(p=>[+p[0].toFixed(5),+p[1].toFixed(5)]),dist:r.dist,dur:r.dur,name:r.name,color:r.color,desc:r.desc};}
  try{await Store.set("state",pack);}catch(e){console.warn(e)}
}
async function loadState(){
  try{const p=await Store.get("state"); if(!p)return;
    S.routes={}; for(const k in p.routes){const r=p.routes[k];S.routes[k]={...r,cum:cumul(r.pts)};}
    S.osm=p.osm; S.weather=p.weather; S.updatedAt=p.updatedAt; S.active=p.active||"principal"; S.dir=p.dir||"A"; S.errors=p.errors||[];
    applyCalibration();
  }catch(e){console.warn(e)}
}

/* ---------- Descarga de mosaicos del mapa ---------- */
function lon2x(lon,z){return (lon+180)/360*2**z}
function lat2y(lat,z){const s=Math.sin(lat*rad);return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*2**z}
function tilesForRoutes(){
  const set=new Set(), detail=document.getElementById("hiDetail")?.checked;
  for(const k in S.routes){
    const r=S.routes[k], isMain=k==="principal"||k===S.active;
    const zmax=isMain?(detail?15:14):12;
    for(let z=7;z<=zmax;z++){
      const rad1=z<=10?1:(isMain&&z<=13?1:0);
      const step=Math.max(150,40075000*Math.cos(36*rad)/2**z/3);
      let acc=step;
      for(let i=0;i<r.pts.length;i++){
        if(i>0)acc+=hav(r.pts[i-1],r.pts[i]); if(acc<step&&i!==r.pts.length-1)continue; acc=0;
        const x=Math.floor(lon2x(r.pts[i][1],z)),y=Math.floor(lat2y(r.pts[i][0],z));
        for(let dx=-rad1;dx<=rad1;dx++)for(let dy=-rad1;dy<=rad1;dy++)set.add(z+"/"+(x+dx)+"/"+(y+dy));
      }
    }
  }
  // Destino (ciudad) con más detalle
  for(let z=13;z<=15;z++){const cx=Math.floor(lon2x(PLACES.destino.lon,z)),cy=Math.floor(lat2y(PLACES.destino.lat,z)),r=z===13?2:z===14?3:4;for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++)set.add(z+"/"+(cx+dx)+"/"+(cy+dy));}
  return [...set];
}
async function fetchTile(key){
  const [z,x,y]=key.split("/").map(Number);
  for(const u of [TILE_URL(z,x,y),TILE_URL_FALLBACK(z,x,y)]){
    try{const r=await fetch(u,{mode:"cors"}); if(r.ok&&/image/.test(r.headers.get("content-type")||"")){const b=await r.blob(); if(b.size<300)continue; await Store.putTile(key,b); return b;}}catch(e){}
  }
  return null;
}
async function downloadTiles(log){
  const all=tilesForRoutes(); const have=await Store.tileKeys(); const todo=all.filter(k=>!have.has(k));
  let done=0, fail=0; const bar=document.getElementById("tileBar");
  const n=todo.length; log(`Descargando mapa: ${n} mosaicos nuevos (${all.length-n} ya guardados)…`);
  let idx=0;
  const worker=async()=>{while(idx<todo.length){const k=todo[idx++]; const b=await fetchTile(k); if(!b)fail++; done++;
    if(done%10===0||done===n){log(`Descargando mapa: ${done}/${n}${fail?" ("+fail+" fallidos)":""}`); if(bar)bar.style.width=(100*done/n)+"%";}}};
  await Promise.all([1,2,3,4,5,6].map(worker));
  await Store.set("tilesInfo_"+TILE_VER,{count:all.length-fail,at:new Date().toISOString()});
  MapView.draw();
}

/* =====================================================================
   MAPA (renderizador propio en canvas, sin dependencias)
   ===================================================================== */
const MapView=(()=>{
  const cv=document.getElementById("map"), ctx=cv.getContext("2d");
  let W=0,H=0,dpr=1, cx=lon2x(-57.75,0)*256, cy=lat2y(-36.4,0)*256, z=7.3; // centro en px mundo z0
  const cache=new globalThis.Map(); const pending=new Set();
  let needFit=false;
  function resize(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;if(!W||!H)return;cv.width=W*dpr;cv.height=H*dpr;if(needFit||!isFinite(z)){needFit=false;fit();}draw();}
  const toScr=(lat,lon)=>{const s=2**z;return [ (lon2x(lon,0)*256-cx)*s+W/2, (lat2y(lat,0)*256-cy)*s+H/2 ];};
  const fromScr=(x,y)=>{const s=2**z;const wx=(x-W/2)/s+cx, wy=(y-H/2)/s+cy;const lon=wx/256*360-180;const n=Math.PI-2*Math.PI*wy/256;return [Math.atan(Math.sinh(n))/rad,lon];};
  function getTile(tz,x,y){
    const key=tz+"/"+x+"/"+y; const c=cache.get(key); if(c)return c==="x"?null:c;
    if(pending.has(key))return null; pending.add(key);
    (async()=>{let b=await Store.tile(key); if(!b&&S.online)b=await fetchTile(key);
      if(b){try{const im=await createImageBitmap(b);cache.set(key,im);if(cache.size>400){cache.delete(cache.keys().next().value);}}catch(e){cache.set(key,"x")}}
      else cache.set(key,"x");
      pending.delete(key); if(b)draw(); else setTimeout(()=>{if(cache.get(key)==="x")cache.delete(key)},15000);})();
    return null;
  }
  let raf=0; function draw(){ if(raf)return; raf=requestAnimationFrame(()=>{raf=0;paint();}); }
  function paint(){
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle="#e9eef2"; ctx.fillRect(0,0,W,H);
    const tz=Math.max(3,Math.min(18,Math.round(z))); const sc=2**(z-tz); const ts=256*sc;
    const wx0=(cx-W/2/2**z)*2**tz/256*256, wy0=(cy-H/2/2**z)*2**tz/256*256; // en px de tz
    const x0=Math.floor(wx0/256), y0=Math.floor(wy0/256), nx=Math.ceil(W/ts)+1, ny=Math.ceil(H/ts)+1;
    for(let x=x0;x<=x0+nx;x++)for(let y=y0;y<=y0+ny;y++){
      if(y<0||y>=2**tz)continue; const xx=((x%2**tz)+2**tz)%2**tz;
      const sx=(x*256-wx0)*sc, sy=(y*256-wy0)*sc;
      let im=getTile(tz,xx,y);
      if(im){ctx.drawImage(im,sx,sy,ts+0.5,ts+0.5);continue;}
      // usar mosaico padre ya cargado como relleno
      for(let up=1;up<=4;up++){const pz=tz-up; if(pz<3)break; const k=pz+"/"+(xx>>up)+"/"+(y>>up); const p=cache.get(k); if(p&&p!=="x"){const f=2**up, ox=(xx%f)*256/f, oy=(y%f)*256/f; ctx.drawImage(p,ox,oy,256/f,256/f,sx,sy,ts+0.5,ts+0.5);break;}}
    }
    // rutas
    const keys=Object.keys(S.routes).sort((a,b)=>(a===S.active)-(b===S.active));
    for(const k of keys){const r=S.routes[k]; const act=k===S.active;
      ctx.lineJoin="round";ctx.lineCap="round";
      ctx.beginPath(); r.pts.forEach((p,i)=>{const [x,y]=toScr(p[0],p[1]); i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
      if(act){ctx.strokeStyle="#ffffff";ctx.lineWidth=9;ctx.stroke();}
      ctx.strokeStyle=r.color||"#1e7bff"; ctx.globalAlpha=act?1:.55; ctx.lineWidth=act?5:3; ctx.stroke(); ctx.globalAlpha=1;
    }
    // POIs
    const showFuel=z>=10.5;
    for(const p of S.pois){
      if(!relevantDir(p))continue;
      if(p.type==="fuel"&&!showFuel)continue;
      if(p.type==="caution"&&z<9)continue;
      const [x,y]=toScr(p.lat,p.lon); if(x<-30||y<-30||x>W+30||y>H+30)continue; p._x=x;p._y=y;
      if(p.type==="radar"){const lim=limitAt(p.km,S.dir); const rr=z>=10?13:9;
        ctx.beginPath();ctx.arc(x,y,rr,0,7);ctx.fillStyle="#fff";ctx.fill();ctx.lineWidth=z>=10?4:3;ctx.strokeStyle="#d11";ctx.stroke();
        if(z>=9){ctx.fillStyle="#111";ctx.font=`bold ${z>=10?11:9}px system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(lim??"R",x,y+0.5);}}
      else if(p.type==="osmcam"){ if(p.dup&&z<12)continue; ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fillStyle="#ff8a3d";ctx.fill();ctx.lineWidth=2;ctx.strokeStyle="#fff";ctx.stroke();}

function onPos(pos){

let hintMain=null, hintAct=null;
function tripState(){

  if(main){const pm=project(g,main.pts,main.cum,hintMain);hintMain=pm.i; if(pm.dist<120&&CAL)st.km=kmFromAlong(pm.along); st.mainDist=pm.dist;}

    const total=act.cum[act.cum.length-1];

      if(p._act==null||p._actKey!==S.active){const pr=project([p.lat,p.lon],act.pts,act.cum);p._act=pr.dist<120?pr.along:null;p._actKey=S.active;}

    const tags=[];
    for(const f of DATA.fixed)if((f.s==="AD"||f.s===dir)&&inSeg(f.km))tags.push(`<span class="pill r">📷 km ${fmtKm(f.km)} ${f.loc}</span>`);
    for(const t of DATA.tolls)if(inSeg(t.km))tags.push(`<span class="pill t">💲 ${t.name}</span>`);
    for(const c of DATA.caution)if(inSeg(c.km))tags.push(`<span class="pill c">⚠ ${c.txt}</span>`);
    for(const m of DATA.mobile)if(!m.general&&m.from<hi&&m.to>lo)tags.push(`<span class="pill m">🚓 Móviles km ${m.from}–${m.to}</span>`);
    for(const p of S.pois)if(p.type==="osmcam"&&!p.dup&&p.km!=null&&inSeg(p.km))tags.push(`<span class="pill o">📷 OSM km ${fmtKm(p.km)}</span>`);
    const cur=curKm!=null&&inSeg(curKm);
    const len=to!=null?Math.abs(to-from):null;
    const tref=dir==="A"&&nx&&nx[2]!=null?` · tiempo ref. ${String(nx[2]).replace(".",",")} min`:"";
    h+=`<div class="tira-row${cur?" cur":""}" ${cur?'id="curRow"':""}>
      <div class="tira-km"><b>km ${fmtKm(from)}</b><br><span class="mut small">${to!=null?"→ "+fmtKm(to):"fin"}${len!=null?"<br>"+fmtD(len*1000):""}</span></div>
      <div class="sign">${r[1]??"–"}</div>
      <div class="grow small">${tags.join("")||'<span class="mut">Sin controles fijos informados</span>'}${tref?`<div class="mut" style="margin-top:3px">${tref.slice(3)}</div>`:""}${cur?`<div style="color:var(--acc);font-weight:700">● Estás acá (km ${fmtKm(curKm)})</div>`:""}</div></div>`;
  }
  h+=`</div>`;
  h+=`<div class="card"><h2>Otros radares informados (desvíos)</h2><table>${DATA.otherRoutes.map(o=>`<tr><td><b>${o.ruta}</b></td><td>${o.items}</td></tr>`).join("")}</table>
  <div class="small mut" style="margin-top:6px">Los controles móviles de la ANSV y la Provincia cambian de lugar y no tienen ubicación publicada: respetá la señalización en todo el recorrido.</div></div>`;
  el.innerHTML=h;
  const cr=document.getElementById("curRow"); if(cr&&renderTira._lastCur!==curKm){cr.scrollIntoView({block:"center"});} renderTira._lastCur=curKm;
}

function navLinks(r,k){
  const d=PLACES.destino; const dv=DESVIOS.find(x=>x.id===k);
  let g=`https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lon}&travelmode=driving`;
  if(dv&&dv.via.length)g+="&waypoints="+encodeURIComponent(dv.via.map(p=>p[0]+","+p[1]).join("|"));
  if(dv&&dv.exclude==="toll")g+="&avoid=tolls";
  const w=`https://waze.com/ul?ll=${d.lat},${d.lon}&navigate=yes`;
  return `<a href="${g}" target="_blank" rel="noopener">Google Maps</a> · <a href="${w}" target="_blank" rel="noopener">Waze</a>`;
}
function renderDesvios(){
  const el=document.getElementById("v-desvios");
  const keys=Object.keys(S.routes);
  let h=`<div class="card"><h2>Rutas y desvíos calculados</h2><div class="small mut">Tocá una para que sea la ruta activa (las alertas siguen esa ruta). Se recalculan al actualizar con conexión; sin conexión se usan las últimas guardadas.</div></div>`;
  if(!keys.length){h+=`<div class="card">Todavía no se calcularon. Andá a <b>Datos</b> y tocá <b>Actualizar todo</b> con wifi.</div>`;}
  else{
    const main=S.routes.principal;
    h+=`<div class="card" style="padding:4px 12px">`;
    const order=["principal","alt1","alt2","alt3",...DESVIOS.slice(1).map(d=>d.id)].filter(k=>S.routes[k]);
    for(const k of order){const r=S.routes[k];
      // cuántos radares conocidos toca
      let nR=0;for(const p of S.pois){if((p.type==="radar"||(p.type==="osmcam"&&!p.dup))&&relevantDir(p)){if(project([p.lat,p.lon],r.pts,r.cum).dist<120)nR++;}}
      const extra=main&&k!=="principal"?` · ${r.dist>main.dist?"+":""}${((r.dist-main.dist)/1000).toFixed(0)} km, ${r.dur>main.dur?"+":"−"}${fmtDur(Math.abs(r.dur-main.dur))}`:"";
      h+=`<div class="desvio" onclick="selRoute('${k}')"><div class="sw" style="background:${r.color}"></div>
        <div class="grow"><b>${r.name}</b>${k===S.active?' <span class="pill" style="color:var(--acc)">activa</span>':""}<br>
        <span class="small">${(r.dist/1000).toFixed(0)} km · ${fmtDur(r.dur)}${extra} · ${nR} controles conocidos</span><br>
        <span class="small mut">${r.desc||DESVIOS[0].desc}</span><br><span class="small" onclick="event.stopPropagation()">Abrir en ${navLinks(r,k)}</span></div></div>`;}
    h+=`</div><div class="small mut">Los tiempos son de OSRM, sin tránsito. Los links de Google Maps incluyen los puntos de paso del desvío.</div>`;
  }
  el.innerHTML=h;
}
function selRoute(k){S.active=k;hintAct=null;saveState();renderAll();document.querySelector('nav button[data-v="mapa"]').click();MapView.fit();}

const WCODE={0:"☀️ despejado",1:"🌤 mayormente despejado",2:"⛅ parcialmente nublado",3:"☁️ nublado",45:"🌫 niebla",48:"🌫 niebla",51:"🌦 llovizna débil",53:"🌦 llovizna",55:"🌧 llovizna intensa",61:"🌧 lluvia débil",63:"🌧 lluvia",65:"🌧 lluvia fuerte",80:"🌦 chaparrones",81:"🌧 chaparrones",82:"⛈ chaparrones fuertes",95:"⛈ tormenta",96:"⛈ tormenta",99:"⛈ tormenta"};
async function renderDatos(){
  const el=document.getElementById("v-datos");
  const ti=await Store.get("tilesInfo_"+TILE_VER).catch(()=>null);
  const upd=S.updatedAt?new Date(S.updatedAt).toLocaleString("es-AR"):"nunca";
  let h=`<div class="card"><h2>Actualizar (con wifi)</h2>
   <div class="small">Calcula la ruta y todos los desvíos, busca radares, peajes y estaciones en OpenStreetMap, baja el pronóstico y guarda el mapa del recorrido para usarlo <b>sin conexión</b>.</div>
   <label class="chk small"><input type="checkbox" id="hiDetail"> Más detalle de calles en la ruta activa (más MB)</label>
   <div class="row" style="margin-top:6px"><button class="pri grow" id="bUpd" ${S.online?"":"disabled"}>Actualizar todo</button><button id="bUpdLite" ${S.online?"":"disabled"}>Solo datos</button></div>
   <div class="bar" style="margin-top:8px"><i id="tileBar"></i></div>
   <div class="small mut" id="updLog" style="margin-top:6px">${S.online?"Conectado.":"Sin conexión: se muestran los últimos datos guardados."}</div>
   <div class="small" style="margin-top:8px">Última actualización: <b>${upd}</b><br>Mapa guardado: <b>${ti?ti.count+" mosaicos":"no"}</b>${Store.persistent?"":" · <span style='color:var(--warn)'>este navegador no permite guardar datos de forma permanente</span>"}</div>
   ${S.errors&&S.errors.length?`<div class="small" style="color:var(--warn);margin-top:6px">Avisos: ${S.errors.join(" · ")}</div>`:""}
  </div>`;
  h+=`<div class="card"><h2>Viaje</h2>
   <div class="small">Origen: <b>${PLACES.origen.name}</b><br>Destino: <b>${PLACES.destino.name}</b></div>
   <div class="row" style="margin-top:8px"><button class="pri grow" onclick="startTrip();document.querySelector('nav button[data-v=mapa]').click()">▶ Iniciar viaje (GPS + alertas)</button></div>
   <div class="small mut" style="margin-top:6px">Mantiene la pantalla encendida, avisa con sonido y vibración a 2 km y a 500 m de cada control, y muestra la máxima del tramo. Configurá Maps/Waze antes de salir y no manipules el celular manejando.</div>
   <details style="margin-top:8px"><summary class="small">Cambiar origen</summary>
    <div class="small" style="margin:6px 0">Coordenadas "lat, lon" (podés copiarlas de Google Maps):</div>
    <input type="text" id="inOrig" value="${PLACES.origen.lat}, ${PLACES.origen.lon}">
    <div class="row" style="margin-top:6px"><button class="grow" onclick="setOrigin()">Guardar origen</button><button onclick="originFromGps()">Usar mi ubicación</button></div>
    <div class="small mut">Después tocá Actualizar todo.</div></details>
  </div>`;
  if(S.weather){h+=`<div class="card"><h2>Pronóstico</h2><table><tr><th></th>${S.weather.locs[0].daily.time.map(t=>`<th>${new Date(t+"T12:00").toLocaleDateString("es-AR",{weekday:"short",day:"numeric"})}</th>`).join("")}</tr>`;
    for(const l of S.weather.locs){h+=`<tr><td><b>${l.name}</b></td>${l.daily.time.map((t,i)=>`<td>${WCODE[l.daily.weather_code[i]]||""}<br>${Math.round(l.daily.temperature_2m_min[i])}°/${Math.round(l.daily.temperature_2m_max[i])}° · 💧${l.daily.precipitation_probability_max[i]??"–"}%<br>ráfagas ${Math.round(l.daily.wind_gusts_10m_max[i])} km/h</td>`).join("")}</tr>`;}
    h+=`</table><div class="small mut" style="margin-top:4px">Open-Meteo · bajado ${new Date(S.weather.at).toLocaleString("es-AR")}</div></div>`;}
  const nOsm=S.osm?S.osm.cams.length:0;
  h+=`<div class="card"><h2>Qué muestra el mapa y de dónde sale</h2>
   <table>
   <tr><td><span class="sign" style="width:26px;height:26px;border-width:3px;font-size:10px">80</span></td><td><b>Radar fijo oficial</b> (${DATA.fixed.length} en Ruta 2). Km y sentido del mapa provincial de radares; la máxima sale del registro de InfraccionesBA. La posición se calcula a partir del km (±1 km).</td></tr>
   <tr><td><span class="dot" style="background:#ff8a3d;width:14px;height:14px"></span></td><td><b>Cámaras de OpenStreetMap</b> (${nOsm} sobre tus rutas). Cargadas por la comunidad; pueden estar desactualizadas.</td></tr>
   <tr><td><span style="display:inline-block;width:22px;height:8px;background:var(--warn)"></span></td><td><b>Zona de control móvil autorizada</b> (Gral. Pueyrredón km 384–399).</td></tr>
   <tr><td><span class="dot" style="background:#5b6cff;border-radius:2px;width:14px;height:14px"></span></td><td>Peajes</td></tr>
   <tr><td><span class="dot" style="background:#2fbf71"></span></td><td>Estaciones de servicio (visibles con zoom)</td></tr>
   <tr><td>⚠️</td><td>Puntos de precaución de la Ruta 2</td></tr></table>
   <div class="small mut" style="margin-top:8px">Las alertas de usuarios de Waze no tienen fuente pública: para eso abrí la ruta en Waze desde <b>Desvíos</b>. El registro oficial incluye además un <b>tiempo de referencia</b> entre progresivas (pestaña Tramos), pero no hay confirmación oficial de que se multe por velocidad promedio.</div>
   <div class="small" style="margin-top:8px">Fuentes: <a href="https://infraccionesba.gba.gob.ar/equiposDeConstatacion" target="_blank">InfraccionesBA – Radares</a> · <a href="https://lomasnoticias.com.ar/nota/2023/conoce-donde-se-encuentran-los-radares-de-las-rutas-hacia-la-costa-atlantica/" target="_blank">Mapa provincial (Lomas Noticias)</a> · <a href="https://www.lanacion.com.ar/autos/ruta-2-donde-estan-los-radares-de-velocidad-nid27122024/" target="_blank">La Nación</a> · <a href="https://www.infozona.com.ar/atencion-conductores-nuevos-radares-en-ruta-2-y-ruta-11/" target="_blank">Infozona (feb 2026)</a> · OpenStreetMap · OSRM · Open-Meteo<br>Consultá o hacé un descargo de multas en <a href="https://infraccionesba.gba.gob.ar/consulta-infraccion" target="_blank">infraccionesba.gba.gob.ar</a></div>
   <div class="small mut" style="margin-top:6px">Datos embebidos: versión ${DATA.version}.</div>
   <div class="row" style="margin-top:8px"><button onclick="clearMap()">Borrar mapa guardado</button></div></div>`;
  el.innerHTML=h;
  document.getElementById("bUpd").onclick=()=>runUpdate(true);
  document.getElementById("bUpdLite").onclick=()=>runUpdate(false);
}
let updating=false;
async function runUpdate(tiles){ if(updating)return; updating=true; document.getElementById("bUpd").disabled=true;document.getElementById("bUpdLite").disabled=true;
  try{await updateAll(tiles);}catch(e){const l=document.getElementById("updLog");if(l)l.textContent="Error: "+e.message;}
  updating=false; renderDatos(); }
function setOrigin(){const v=document.getElementById("inOrig").value.split(",").map(s=>parseFloat(s));if(v.length===2&&!isNaN(v[0])&&!isNaN(v[1])){PLACES.origen={name:"Origen personalizado ("+v[0].toFixed(4)+", "+v[1].toFixed(4)+")",lat:v[0],lon:v[1]};Store.set("origen",PLACES.origen);renderDatos();toast("Origen guardado. Tocá Actualizar todo.");}else toast("Formato inválido. Ejemplo: -34.95, -57.94");}
async function originFromGps(){const st=await gpsStatus();if(st!=="granted"&&st!=="prompt"){gpsHelp(st);return;}navigator.geolocation.getCurrentPosition(p=>{PLACES.origen={name:"Mi ubicación ("+p.coords.latitude.toFixed(4)+", "+p.coords.longitude.toFixed(4)+")",lat:p.coords.latitude,lon:p.coords.longitude};Store.set("origen",PLACES.origen);renderDatos();},e=>gpsHelp(e.code===1?"denied":e.code===2?"unavailable":"timeout"),{enableHighAccuracy:true,timeout:30000});}
async function clearMap(){await Store.clearTiles();await Store.set("tilesInfo_"+TILE_VER,null);renderDatos();toast("Mapa borrado.");}

function renderAll(){ renderEmpty(); MapView.draw(); renderTira(); renderDesvios(); renderDatos(); renderDrive(); }

/* =====================================================================
   INICIO
   ===================================================================== */
function setNet(){S.online=navigator.onLine;const n=document.getElementById("net");n.textContent=S.online?"online":"offline";n.className=S.online?"on":"";if(document.getElementById("v-datos").classList.contains("on"))renderDatos();}
window.addEventListener("online",setNet);window.addEventListener("offline",setNet);
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+b.dataset.v));if(b.dataset.v==="mapa")MapView.resize();if(b.dataset.v==="tira")renderTira();if(b.dataset.v==="datos")renderDatos();});
document.querySelectorAll("#dirSeg button").forEach(b=>b.onclick=()=>{S.dir=b.dataset.d;document.querySelectorAll("#dirSeg button").forEach(x=>x.classList.toggle("on",x===b));S.alerted.clear();saveState();renderAll();});
document.getElementById("bZin").onclick=()=>MapView.zoomAt(1);
document.getElementById("bZout").onclick=()=>MapView.zoomAt(-1);
document.getElementById("bFit").onclick=()=>{S.follow=false;updFollowBtn();MapView.fit();};
document.getElementById("bGps").onclick=()=>{ if(S.watchId==null){startTrip();} else {S.follow=!S.follow;updFollowBtn();if(S.follow&&S.gps)MapView.setView(S.gps.lat,S.gps.lon,Math.max(MapView.z,12.5));} };

(async()=>{
  await Store.open();
  try{const tv=await Store.get("tileVer"); if(tv!==TILE_VER){await Store.clearTiles(); await Store.set("tileVer",TILE_VER);}}catch(e){}
  try{const o=await Store.get("origen");if(o)PLACES.origen=o;}catch(e){}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  await loadState();
  document.querySelectorAll("#dirSeg button").forEach(x=>x.classList.toggle("on",x.dataset.d===S.dir));
  setNet(); MapView.resize(); renderAll(); MapView.fit();
  refreshGpsChip(); { const st=await gpsStatus(); if(st!=="granted"){ try{ if(!sessionStorage.getItem("gpsAsked")){sessionStorage.setItem("gpsAsked","1"); gpsHelp(st);} }catch(e){ gpsHelp(st);} } }
  if("serviceWorker" in navigator && location.protocol==="https:"){try{navigator.serviceWorker.register("sw.js");}catch(e){}}
})();
</script>
